name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours to keep the Streamlit Cloud app active
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          URL="https://mnemeth1992-ai-autistic-master-prompts.streamlit.app"
          echo "Pinging Streamlit Cloud app at $URL..."
          curl -s -L -m 30 "$URL" > /dev/null || true
          echo "Ping finished!"
